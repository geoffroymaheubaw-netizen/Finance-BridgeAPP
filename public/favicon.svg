<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#101124" />
      <stop offset="100%" stop-color="#070711" />
    </radialGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6E7BFF" />
      <stop offset="50%" stop-color="#5560EA" />
      <stop offset="100%" stop-color="#8072FF" />
    </linearGradient>

    <!-- Filter Glow -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#FFFFFF" />
    </marker>
  </defs>

  <!-- Dark Canvas Base -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Outer Neon Glowing Squircle / App Icon Frame -->
  <rect
    x="80"
    y="80"
    width="352"
    height="352"
    rx="96"
    ry="96"
    fill="#0C0D1E"
    stroke="url(#neonBorder)"
    stroke-width="14"
    filter="url(#neonGlow)"
  />

  <!-- Main Bridge Deck -->
  <path
    d="M 140,278 L 372,278"
    stroke="#FFFFFF"
    stroke-width="11"
    stroke-linecap="round"
  />

  <!-- Left and Right Towers / Pillars -->
  <path
    d="M 206,220 L 206,322"
    stroke="#FFFFFF"
    stroke-width="11"
    stroke-linecap="round"
  />
  <path
    d="M 306,220 L 306,322"
    stroke="#FFFFFF"
    stroke-width="11"
    stroke-linecap="round"
  />

  <!-- Side Suspension Cables -->
  <path
    d="M 140,278 Q 192,278 206,232"
    stroke="#FFFFFF"
    stroke-width="10"
    stroke-linecap="round"
    fill="none"
  />
  <path
    d="M 306,232 Q 320,278 372,278"
    stroke="#FFFFFF"
    stroke-width="10"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Under-deck Arch -->
  <path
    d="M 206,316 Q 256,270 306,316"
    stroke="#FFFFFF"
    stroke-width="11"
    stroke-linecap="round"
    fill="none"
  />

  <!-- 4 Ascending Financial Volume / Stock Bars -->
  <rect x="224" y="262" width="11" height="15" rx="3" fill="#FFFFFF" />
  <rect x="244" y="248" width="11" height="29" rx="3" fill="#FFFFFF" />
  <rect x="264" y="235" width="11" height="42" rx="3" fill="#FFFFFF" />
  <rect x="284" y="218" width="11" height="59" rx="3" fill="#FFFFFF" />

  <!-- Rising Dynamic Arrow Trend Line -->
  <path
    d="M 220,260 L 253,235 L 261,241 L 297,204"
    stroke="#FFFFFF"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
  <!-- Arrow Head Polygon -->
  <polygon points="288,198 307,201 302,220" fill="#FFFFFF" />
</svg>
