<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Squircle -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1026" />
      <stop offset="50%" stop-color="#080916" />
      <stop offset="100%" stop-color="#05060D" />
    </linearGradient>

    <!-- Glowing Border Gradient with Neon Indigo/Violet -->
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="40%" stop-color="#6366F1" />
      <stop offset="80%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>

    <!-- Inner Ambient Radial Glow -->
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#4F46E5" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Drop Shadow Filter for outer frame -->
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4F46E5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded Squircle Base (Rounded Corners with transparent canvas outside) -->
  <rect
    x="24"
    y="24"
    width="464"
    height="464"
    rx="116"
    ry="116"
    fill="url(#cardBg)"
    stroke="url(#neonBorder)"
    stroke-width="16"
    filter="url(#iconShadow)"
  />

  <!-- Subtle Inner Ambient Lighting inside the rounded box -->
  <rect
    x="24"
    y="24"
    width="464"
    height="464"
    rx="116"
    ry="116"
    fill="url(#innerGlow)"
  />

  <!-- Bridge Graphic Container -->
  <g transform="translate(0, 0)">
    <!-- Main Bridge Deck -->
    <path
      d="M 124,284 L 388,284"
      stroke="#FFFFFF"
      stroke-width="12"
      stroke-linecap="round"
    />

    <!-- Left & Right Main Towers / Pillars -->
    <path
      d="M 198,216 L 198,336"
      stroke="#FFFFFF"
      stroke-width="12"
      stroke-linecap="round"
    />
    <path
      d="M 314,216 L 314,336"
      stroke="#FFFFFF"
      stroke-width="12"
      stroke-linecap="round"
    />

    <!-- Left Side Suspension Cable -->
    <path
      d="M 124,284 Q 182,284 198,230"
      stroke="#FFFFFF"
      stroke-width="11"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Right Side Suspension Cable -->
    <path
      d="M 314,230 Q 330,284 388,284"
      stroke="#FFFFFF"
      stroke-width="11"
      stroke-linecap="round"
      fill="none"
    />

    <!-- Under-Deck Structural Arch -->
    <path
      d="M 198,330 Q 256,274 314,330"
      stroke="#FFFFFF"
      stroke-width="12"
      stroke-linecap="round"
      fill="none"
    />

    <!-- 4 Ascending Financial Volume / Stock Bars -->
    <rect x="220" y="266" width="13" height="18" rx="3.5" fill="#FFFFFF" />
    <rect x="244" y="250" width="13" height="34" rx="3.5" fill="#FFFFFF" />
    <rect x="268" y="234" width="13" height="50" rx="3.5" fill="#FFFFFF" />
    <rect x="292" y="214" width="13" height="70" rx="3.5" fill="#FFFFFF" />

    <!-- Rising Dynamic Arrow Trend Line -->
    <path
      d="M 214,264 L 253,234 L 263,242 L 305,200"
      stroke="#FFFFFF"
      stroke-width="10"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- Arrow Head -->
    <polygon points="296,192 318,196 312,218" fill="#FFFFFF" />
  </g>
</svg>
